/* 24-hour solar-time dial: 12 (noon) at the meridian (top), hours increase clockwise (PM = west), 12 again at the bottom (midnight). 15° = 1 h, ticks every 5 min. */

 for(let m=0;m<288;m++){const a=m*1.25,h=m%12==0,hf=m%6==0,q=m%3==0,len=(h?4.4:hf?3.4:q?2.5:1.6)*k,[x1,y1]=P(r1,a),[x2,y2]=P(r1+len,a);
  s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col}" stroke-width="${(h?.5:hf?.3:.15)*k}"/>`;
  if(h){const t=12+a/15,[tx,ty]=P(r1+10.4*k,a),rot=(a>90&&a<270)?a+180:a;
   s+=`<text x="${tx}" y="${ty}" transform="rotate(${rot} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-weight="bold" font-size="${5.6*k}" style="fill:${col}">${(t%12)||12}</text>`}}

function alignAlt(){const sg=S.oap=='am'?-1:1;let t=events(S.t).noon;

  if(Math.abs(c)>1){$('err').textContent='Altitude '+S.oa+'° is never reached on this date at this latitude (today the Sun goes from '+f1(-(90-Math.abs(S.lat+sn.dec)))+'° up to '+f1(90-Math.abs(S.lat-sn.dec))+'°).';return}

function buildBtns(){$('btns').innerHTML=`<button id="b1">⟲ ${t('l')}</button><button id="b2">⟳ ${t('r')}</button><button id="b3">${t('reset')}</button><button id="b4">${S.lock?t('unlock'):t('lock')}</button><button id="b5">${S.side=='f'?t('back'):t('front')}</button><button id="b6">${t('al')}</button><button id="b7" class="on">${t('rs')}</button><button id="b8">↻ ${t('now')}</button><button id="b9">📍 ${t('gps')}</button><button id="b10">⬇ ${t('install')}</button><button id="b11">🌙 ${t('manim')}</button><button id="b12"></button>
 <div style="flex:1 1 100%;margin-top:4px;padding:6px;background:#fffaf0;border:1px solid #1b3f8f;border-radius:6px"><div class="note"><b>ارتفاع الشمس / Sun altitude → time</b>: measure it on the Back with the alidade, type it here, then the rete turns so the Sun sits on that altitude circle and the rule gives the hour.</div>

 <button id="oal">Alidade → altitude</button><button id="oab" class="on"><b>Align Sun &amp; read time</b></button></div></div>`;
 const step=d=>{if(!S.lock){S.live=false;S.t+=d/360.98564736629*864e5;draw()}};

 $('b7').onclick=()=>{S.side='f';S.follow=true;S.rule=ruleSun();buildBtns();draw()};

 buildW();$('bWatch').textContent='⌚ '+t('watch');$('bTrad').textContent=S.trad?t('mod'):t('trad');$('bLearn').textContent=t('learn');

/* Dragging: near the rule → rule; inside plate → rete (changes time via sidereal rate); outside → rule. Back: alidade. */
(function(){const sv=$('svg');let mode=null,last=0;
 const ang=e=>{const r=sv.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);return{a:atan2(dx,-dy),rad:Math.hypot(dx,dy)/(r.width/200),dx,dy}};
 sv.onpointerdown=e=>{if(anim){anim=null;S.live=true;S.follow=true;S.t=Date.now();buildWbtn()}const g=ang(e);sv.setPointerCapture(e.pointerId);
  if(S.side=='b')mode='a';else{const dr=Math.abs(mod(g.a-S.rule+90,180)-90);mode=(dr<7||g.rad>80)?'r':'e'}last=g.a};
 sv.onpointermove=e=>{if(!mode)return;const g=ang(e);
  if(mode=='a')S.ali=atan2(-g.dy,g.dx);else if(mode=='r'){S.follow=false;S.rule=mod(g.a,360);const hs=ruleSun();if(Math.abs(mod(S.rule-hs+180,360)-180)<3){S.rule=hs;S.follow=true}}
  else if(!S.lock){S.live=false;const d=mod(g.a-last+180,360)-180;S.t+=d/360.98564736629*864e5}last=g.a;draw()};
 sv.onpointerup=sv.onpointercancel=()=>mode=null})();

const row=(k,v)=>`<tr><td>${k}</td><td><b>${v}</b></td></tr>`;
function sunpath(){const W=320,H=150,d0=dayStart(S.t),E=events(S.t);let pts=[];
 const X0=m=>m/1440*W,Y0=a=>130-(a+20)/110*115;
 for(let m=0;m<=1440;m+=10)pts.push(X0(m).toFixed(1)+','+Y0(sunHor(d0+m*6e4).alt).toFixed(1));
 const mk=(ms,l)=>ms?`<line x1="${X0((ms-d0)/6e4)}" x2="${X0((ms-d0)/6e4)}" y1="5" y2="130" stroke="#999" stroke-dasharray="3"/><text x="${X0((ms-d0)/6e4)}" y="145" font-size="9" text-anchor="middle">${l} ${fT(ms)}</text>`:'';
 const nm=(S.t-d0)/6e4;
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:#fffaf0"><line x1="0" x2="${W}" y1="${Y0(0)}" y2="${Y0(0)}" stroke="#2a1a0a"/><polyline fill="none" stroke="#b9650a" stroke-width="2" points="${pts.join(' ')}"/>${mk(E.rise.t,'E ↑')}${mk(E.noon,'S')}${mk(E.set.t,'W ↓')}<circle cx="${X0(nm)}" cy="${Y0(sunHor(S.t).alt)}" r="5" fill="#e0a21a" stroke="#7a2e0e"/><text x="3" y="${Y0(0)-3}" font-size="9">horizon</text></svg>`}
const tabs={
ast(){const h=sunHor(S.t),E=events(S.t),P=prayers(S.t),q=qibla(),dl=E.rise.t&&E.set.t?(E.set.t-E.rise.t)/6e4:(E.rise.p=='day'?1440:0);
 return`<h3>Rabat dashboard — ${S.place||'custom location'} (${S.lat.toFixed(4)}°, ${S.lon.toFixed(4)}°)</h3><table>${row('Date / local time',new Date(S.t+S.tz*36e5).toISOString().slice(0,10)+' '+fT(S.t))+row('Sunrise',fE(E.rise,1))+row('Solar noon',fT(E.noon))+row('Sunset',fE(E.set,1))+row('Day length',fD(dl))+row('Sun altitude / azimuth',f1(h.alt)+'° / '+f1(h.az)+'°')+row('Qibla bearing',f1(q.b)+'° '+wind(q.b))+['Fajr','Dhuhr','Asr','Maghrib','Isha'].map(k=>row(k,fE(P[k]))).join('')}</table><h3>Sun path (altitude vs local time)</h3>${sunpath()}<p class="note">Drag the rete (inside the plate) to move time; drag the rule or the outer ring for the rule; the Back shows the alidade. Hijri date: ${(()=>{const[y,m,d]=hijri(S.t);return`calculated/approximate ${y}-${m}-${d} AH (tabular, not an official religious calendar)`})()}</p>`},
sun(){const h=sunHor(S.t),E=events(S.t),n=(a,b)=>`${fE(a)} / ${fE(b)}`,dl=E.rise.t&&E.set.t?(E.set.t-E.rise.t)/6e4:(E.rise.p=='day'?1440:0);
 return`<table>${row('Declination',f1(h.s.dec)+'°')+row('Equation of time',f1(h.s.eot)+' min')+row('Ecliptic longitude λ',f1(h.s.lam)+'°')+row('Altitude (geometric)',f1(h.alt)+'°')+row('Azimuth (N=0, E=90)',f1(h.az)+'°')+row('Sunrise / Sunset',n(E.rise,E.set))+row('Solar noon',fT(E.noon))+row('Civil twilight (−6°)',n(E.civ[0],E.civ[1]))+row('Nautical (−12°)',n(E.nau[0],E.nau[1]))+row('Astronomical (−18°)',n(E.ast[0],E.ast[1]))+row('Day length',fD(dl))+row('Night length',fD(1440-dl))}</table>${sunpath()}
 <h3>Time from solar altitude</h3><div class="g"><label>Altitude °<input id="ah" type="number" value="${S.ah}"></label></div><div id="ahr">${altTime()}</div>`},
pray(){const P=prayers(S.t),o=Object.entries(METH).map(([k,v])=>`<option value="${k}" ${k==S.method?'selected':''}>${v[0]}</option>`).join('');
 return`<div class="g"><label>Method<select id="mt">${o}</select></label><label>Fajr angle °<input id="fa" type="number" step=".5" value="${S.method=='CUS'?S.fa:METH[S.method][1]}" ${S.method=='CUS'?'':'disabled'}></label><label>Isha angle °<input id="ia" type="number" step=".5" value="${S.method=='CUS'?S.ia:METH[S.method][2]}" ${S.method=='CUS'?'':'disabled'}></label><label>Asr<select id="as"><option value="1" ${S.asr==1?'selected':''}>Shafi'i / Standard</option><option value="2" ${S.asr==2?'selected':''}>Hanafi</option></select></label></div>
 <table>${['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'].map(k=>row(k,fE(P[k],k=='Sunrise'))).join('')}</table>${S.method=='MA'?'<p class="note">Morocco (Ministry of Habous): Fajr 19°, Isha 17°, Dhuhr and Maghrib +5 min, sunrise −3 min. Checked against the published Rabat timetable for 15–18 Oct 2026: every prayer within one minute.</p>':''}<p class="note">Times are astronomical computations. The choice of angles and Asr convention is a jurisprudential convention that differs between authorities; no method is presented as universally authoritative. Verify with your local religious authority (Morocco publishes official timetables). Dhuhr = solar noon, no safety margin added.</p>`},
qib(){const q=qibla();return`<table>${row('Qibla bearing (from true North)',f1(q.b)+'° '+wind(q.b))+row('Great-circle distance to Kaaba',Math.round(q.dist)+' km')}</table>
 <svg viewBox="-60 -60 120 120" style="width:240px;display:block;margin:auto"><circle r="50" fill="#fffaf0" stroke="#2a1a0a"/>${[0,90,180,270].map((a,i)=>X(44*sin(a),-44*cos(a),0,'NESW'[i],8)).join('')}<g transform="rotate(${q.b})"><path d="M0 -42L5 0L-5 0Z" fill="#1f6b5c"/><circle r="3"/></g></svg><p class="note">Formula: θ = atan2( sinΔλ·cosφK , cosφ·sinφK − sinφ·cosφK·cosΔλ ), Kaaba 21.4225°N 39.8262°E. It is drawn as the green azimuth curve on the plate. Magnetic compasses need local declination correction.</p>`},
star(){const lst=lstOf(S.t);return`<table><tr><th>Star</th><th>RA</th><th>Dec</th><th>Alt</th><th>Az</th></tr>${STARS.map(([n,a,ra,d])=>{const h=hor(lst-ra*15,d,S.lat);return`<tr><td>${n}<br><span dir="rtl">${a}</span></td><td>${ra.toFixed(3)}h</td><td>${d.toFixed(2)}°</td><td ${h.alt<0?'style="opacity:.5"':''}>${f1(h.alt)}°</td><td>${f1(h.az)}°</td></tr>`}).join('')}</table><p class="note">LST ${f1(lst)}° = ${(lst/15).toFixed(2)} h. J2000 coordinates, no refraction/precession. Canopus (Dec −52.7°) lies beyond the −35° plate limit and is therefore not drawn on the rete; its altitude here is at most ${f1(90-S.lat-52.6957)}°.</p>`},
cal(){const s=sun(S.t),h=hijri(S.t),d=new Date(S.t+S.tz*36e5),doy=Math.floor((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5),z=Math.floor(s.lam/30);
 return`<table>${row('Gregorian',d.toISOString().slice(0,10))+row('Julian day',jd(S.t).toFixed(4))+row('Day of year',doy)+row('Solar longitude λ',f1(s.lam)+'°')+row('Zodiac sign',`${ZOD[z]} ${ZEN[z]} / ${ZAR[z]} ${f1(s.lam-z*30)}°`)+row('Declination δ',f1(s.dec)+'°  (sinδ = sinε·sinλ)')+row('Obliquity ε',s.eps.toFixed(4)+'°')+row('Local sidereal time',(lstOf(S.t)/15).toFixed(3)+' h')+row('Calculated/approximate Hijri date',h[0]+'-'+p2(h[1])+'-'+p2(h[2])+' AH')}</table><p class="note">Hijri: tabular (arithmetical) civil conversion — an approximation, not an official/sighted religious calendar. The tropical zodiac (0° Aries = March equinox) is used; the back scale places each date at its true λ for this year.</p>`},
sha(){const h=sunHor(S.t),a=h.alt,sh=S.sh;return`<div class="g"><label>Object height m<input id="sh" type="number" step="any" value="${sh.h}"></label></div><table>${row('Solar altitude',f1(a)+'°')+row('Shadow length',a>0?(sh.h/tan(a)).toFixed(2)+' m  (= height / tan alt)':'Sun below horizon')+row('Gnomon of 12 digits: shadow',a>0?(12/tan(a)).toFixed(1)+' digits':'—')}</table><p class="note">Traditional demo: a 12-digit gnomon casts a shadow of 12 digits at 45° altitude; 24 digits at 26.6°. On the back, the alidade reading of the Sun against the shadow square gives the same ratio.</p>
 <h3>Object height with the alidade</h3><div class="g"><label>Distance m<input id="sd" type="number" value="${sh.d}"></label><label>Angle ° (alidade)<input id="sa" type="number" value="${sh.a}"></label><label>Eye height m<input id="se" type="number" value="${sh.e}"></label></div><b>Height ≈ ${(sh.e+sh.d*tan(sh.a)).toFixed(2)} m</b> (h = eye + d·tan α)`},
print(){return`<div class="g"><label>Scale<select id="psc">${[1,.75,.5].map(v=>`<option value="${v}" ${S.scale==v?'selected':''}>${v*100}%</option>`).join('')}</select></label><label>Paper<select id="ppa"><option value="A4P" ${S.paper=='A4P'?'selected':''}>A4 portrait</option><option value="A4L" ${S.paper=='A4L'?'selected':''}>A4 landscape</option><option value="A3" ${S.paper=='A3'?'selected':''}>A3 portrait</option></select></label></div>
 <button id="pgo"><b>PRINT REAL ASTROLABE</b></button><p class="err">Print at Actual size / 100%. Do NOT fit to page. Do NOT scale. Margins: none. Black on white vector lines. Verify with the ruler on every page.</p><div>${sheetsHTML()}</div>`},
how(){return`<h3>Classical operations</h3><ol class="note" style="font-size:13px">
<li><b>Solar altitude:</b> hold the astrolabe by the ring, sight the Sun along the alidade (back), read the outer scale.</li><li><b>Time from altitude:</b> front: set the Sun's date point on the ecliptic on that almucantar (east = morning), read the hour with the rule.</li><li><b>Sunrise/sunset:</b> bring the Sun's point to the horizon (east/west); the rule reads the hour angle.</li><li><b>Solar noon:</b> Sun's point on the meridian line.</li><li><b>Day/night length:</b> twice the hour angle between meridian and horizon crossing.</li><li><b>Azimuth:</b> read the azimuth curve through the Sun's point.</li><li><b>Prayer times:</b> Dhuhr = noon; Asr = Sun on the almucantar from the Asr panel; Maghrib = horizon; Fajr/Isha = −18°/−17° almucantars (dashed lines).</li><li><b>Qibla:</b> follow the green azimuth curve; add the Sun's azimuth reading to orient.</li><li><b>Date from Sun:</b> back: zodiac ring λ ↔ date ring.</li><li><b>Declination:</b> δ labels between the rings or sinδ = sinε·sinλ.</li><li><b>Unequal hours:</b> dashed hour lines on the plate; 12 per day.</li><li><b>Shadow:</b> shadow square, or h/tan(alt).</li><li><b>Height of an object:</b> sight the top; h = eye + d·tan α.</li><li><b>Latitude from Polaris:</b> latitude ≈ Polaris altitude (±1°, correct for its ~0.7° offset from the pole).</li><li><b>Sidereal time:</b> read the rete's angle against the mater (shown as LST).</li><li><b>Star altitude/azimuth:</b> a star pointer's position on the plate gives altitude and azimuth.</li></ol>
 <h3>Scientific notes</h3><ul class="note" style="font-size:12px"><li><b>Model:</b> NOAA/Meeus solar equations; GMST (IAU 1982 linear form); J2000 star coordinates.</li><li><b>Sunrise:</b> upper limb, zenith 90.833° (34′ refraction + 16′ radius) + 0.0347√h dip. Altitudes shown are geometric (no refraction).</li><li><b>Time:</b> a manual UTC offset is used, no tzdata (works offline; set +1 or +0).</li><li><b>Prayer:</b> conventions differ; high latitudes can lack twilight events (reported, not faked). Umm al-Qura Isha = Maghrib + 90 min.</li><li><b>Qibla:</b> spherical great-circle initial bearing.</li><li><b>Projection:</b> stereographic from the south pole, r=R·tan((90°−δ)/2), outer limit δ=−35°; the ecliptic, almucantars, azimuth and hour lines are sampled from exact coordinate transforms.</li><li><b>Simplification:</b> back rings are concentric (historic backs are eccentric); the digital front shows only unequal-hour lines, not equal-hour lines.</li></ul>`},
learn(){const Lr=[['Mater','الأم','Mère','Main body holding the plate and the degree scale.','الجسم الرئيسي الذي يحمل الصفيحة.'],['Tympan / Plate','الصفيحة','Tympan','Latitude-specific disc with horizon and altitude/azimuth curves.','قرص خاص بخط العرض عليه الأفق والسموت.'],['Rete','العنكبوت','Araignée','Rotating star map with ecliptic and star pointers.','شبكة دوّارة للنجوم ودائرة البروج.'],['Alidade','العضادة','Alidade','Back pointer with sights for measuring altitude.','مؤشر خلفي ذو ثقبين لقياس الارتفاع.'],['Rule','المسطرة','Règle','Front pointer to read hours and degrees.','مؤشر أمامي لقراءة الساعات والدرجات.'],['Ecliptic','دائرة البروج','Écliptique','The Sun’s yearly path among the stars.','مسار الشمس السنوي بين النجوم.'],['Zodiac','البروج','Zodiaque','12 signs of 30° along the ecliptic.','اثنا عشر برجًا كل منها 30°.'],['Azimuth','السمت','Azimut','Compass direction measured from north.','الاتجاه من الشمال.'],['Altitude','الارتفاع','Hauteur','Angle above the horizon.','الزاوية فوق الأفق.'],['Meridian','دائرة نصف النهار','Méridien','North–south line through the zenith.','الخط الشمالي الجنوبي المار بالسمت.'],['Horizon','الأفق','Horizon','Boundary of the visible sky (altitude 0°).','حدّ السماء المرئية (ارتفاع 0°).'],['Almucantar','المقنطرات','Almucantarat','Circles of equal altitude.','دوائر متساوية الارتفاع.'],['Hour lines','خطوط الساعات','Lignes horaires','Curves dividing day into 12 unequal hours.','منحنيات تقسم النهار إلى 12 ساعة زمانية.']];
 return`<h3>${t('learn')}</h3><table>${Lr.map(r=>`<tr><td><b>${r[0]}</b><br>${r[1]}<br><i>${r[2]}</i></td><td>${r[3]}<br><span dir="rtl">${r[4]}</span></td></tr>`).join('')}</table>`}};
function altTime(){const E=events(S.t),sd=sun(E.noon).dec,c=(sin(S.ah)-sin(S.lat)*sin(sd))/(cos(S.lat)*cos(sd));
 return Math.abs(c)>1?'Altitude never reached on this date.':`Morning: <b>${fT(E.noon-acos(c)*4*6e4)}</b> · Afternoon: <b>${fT(E.noon+acos(c)*4*6e4)}</b> (local, solar declination ${f1(sd)}°)`}

 on('fa',e=>{S.fa=+e.target.value;renderTab(1)});on('ia',e=>{S.ia=+e.target.value;renderTab(1)});on('as',e=>{S.asr=+e.target.value;renderTab(1)});
 on('sh',e=>{S.sh.h=+e.target.value;renderTab(1)});on('sd',e=>{S.sh.d=+e.target.value;renderTab(1)});on('sa',e=>{S.sh.a=+e.target.value;renderTab(1)});on('se',e=>{S.sh.e=+e.target.value;renderTab(1)});
 on('psc',e=>{S.scale=+e.target.value;renderTab(1)});on('ppa',e=>{S.paper=e.target.value;renderTab(1)});

/* ===== 7. PRINTING (all geometry in mm; instrument group scaled by S.scale, rulers never scaled) ===== */
const PAPER={A4P:[210,297],A4L:[297,210],A3:[297,420]};
function sheet(n,title,body,dim,extra=''){const[W,H]=PAPER[S.paper],s=S.scale;let r='';
 for(const[x,y]of[[8,8],[W-8,8],[8,H-8],[W-8,H-8]])r+=L(x-4,y,x+4,y,.2)+L(x,y-4,x,y+4,.2)+`<circle class="l" cx="${x}" cy="${y}" r="1.5" stroke-width=".2"/>`;
 const rx=15,ry=H-16;r+=L(rx,ry,rx+100,ry,.25);for(let i=0;i<=100;i++)r+=L(rx+i,ry,rx+i,ry-(i%10==0?4:i%5==0?3:1.8),i%10==0?.25:.12);

function samp(a,n,u,v){u=Math.min(n-1.001,Math.max(0,u));v=Math.min(n-1.001,Math.max(0,v));const i=u|0,j=v|0,fu=u-i,fv=v-j,k=j*n+i;return(a[k]*(1-fu)+a[k+1]*fu)*(1-fv)+(a[k+n]*(1-fu)+a[k+n+1]*fu)*fv}
/* psi = elongation; th = screen direction (deg, SVG y-down) towards the Sun. Lit limb faces th. */
function moonCanvas(psi,th,px){if(!TEX)return null;const p=psi>180?360-psi:psi,sp=sin(p),lx=sp*cos(th),ly=sp*sin(th),lz=-cos(p),n=TEX.n;
 const cv=document.createElement('canvas');cv.width=cv.height=px;const cx=cv.getContext('2d'),im=cx.createImageData(px,px),d=im.data;
 for(let j=0;j<px;j++)for(let i=0;i<px;i++){const x=(i+.5)/px*2-1,y=(j+.5)/px*2-1,r2=x*x+y*y;if(r2>1.06)continue;const rr=Math.sqrt(r2),z=Math.sqrt(Math.max(0,1-r2)),u=(x+1)/2*n,v=(y+1)/2*n;
  const a=samp(TEX.A,n,u,v),hx=samp(TEX.H,n,u+1,v)-samp(TEX.H,n,u-1,v),hy=samp(TEX.H,n,u,v+1)-samp(TEX.H,n,u,v-1);
  let nx=x-hx*2.4,ny=y-hy*2.4,nz=Math.max(z,.12);const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;
  const I=Math.max(0,nx*lx+ny*ly+nz*lz),f=I>0?2*I/(I+Math.max(nz,.06)):0,es=(px<110?.2:.09)*a*(.45+.55*z),val=a*f*(px<110?1.3:1.18),limb=1-.14*r2;
  const o=(j*px+i)*4,al=Math.max(0,Math.min(1,(1-rr)*px/2+.5));
  d[o]=255*Math.min(1,(val+es*.8)*limb);d[o+1]=255*Math.min(1,(val*.97+es*.95)*limb);d[o+2]=255*Math.min(1,(val*.9+es*1.3)*limb);d[o+3]=255*al}

function moonPos(sn,psi,Rt,u){const[sx,sy]=eclXY(sn.lam,Rt);
 if(S.moonTrue)return eclXY(mod(sn.lam+psi,360),Rt);
 const ps=psi>180?psi-360:psi,side=ps>=0?1:-1,s=(7.4+5.2*Math.abs(ps)/180)*u;let lo=0,hi=80;
 for(let i=0;i<16;i++){const m=(lo+hi)/2,[x,y]=eclXY(sn.lam+side*m,Rt);Math.hypot(x-sx,y-sy)<s?lo=m:hi=m}

function wLabels(g,lst){const u=W.u,c=W.px/2,a=lst*D,ca=Math.cos(a),sa=Math.sin(a),fs=2.7*u,placed=[],ar=S.lang=='ar';
 g.save();g.translate(c,c);g.beginPath();g.arc(0,0,(WRf-.4)*u,0,TAU);g.clip();g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.font=wFont(fs,600);

 for(const L of W.cl){const x=L.x*ca-L.y*sa,y=L.x*sa+L.y*ca;if(x*x+y*y>(WRf-5)*(WRf-5))continue;const tx=ar?L.ar:(S.lang=='fr'?L.fr:L.en).toUpperCase(),kk=tx+fs;let w=W.lw.get(kk);if(w===undefined){w=g.measureText(tx).width;W.lw.set(kk,w)}
  const X=x*u,Y=y*u;if(placed.some(b=>Math.abs(b[0]-X)<(b[2]+w)/2+u&&Math.abs(b[1]-Y)<fs*1.1))continue;placed.push([X,Y,w]);
  g.strokeStyle='rgba(2,10,42,.9)';g.lineWidth=.75*u;g.strokeText(tx,X,Y);g.fillStyle='rgba(182,218,255,.95)';g.fillText(tx,X,Y)}
 if('letterSpacing'in g)g.letterSpacing='0px';
 g.font=wFont(2.5*u,600);g.textAlign='left';
 for(const L of W.sn){const x=L.x*ca-L.y*sa,y=L.x*sa+L.y*ca;if(x*x+y*y>(WRf-4)*(WRf-4))continue;const tx=ar?L.ar:L.en;g.strokeStyle='rgba(2,10,42,.9)';g.lineWidth=.7*u;g.strokeText(tx,(x+1.6)*u,(y-1.3)*u);g.fillStyle='#ffe0ad';g.fillText(tx,(x+1.6)*u,(y-1.3)*u)}
 g.restore()}
function wHand(g){const u=W.u,c=W.px/2,d=new Date(S.t+S.tz*36e5),hrs=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600+d.getUTCMilliseconds()/36e5,a=(hrs-12)*15*D;
 g.save();g.translate(c,c);g.rotate(a);g.shadowColor='rgba(0,0,0,.65)';g.shadowBlur=3*u;g.shadowOffsetX=1.2*u;g.shadowOffsetY=1.8*u;
 const gr=g.createLinearGradient(-1.1*u,0,1.1*u,0);gr.addColorStop(0,'#fff0d8');gr.addColorStop(.5,'#b57b4e');gr.addColorStop(1,'#f3d3ab');g.fillStyle=gr;
 g.beginPath();g.moveTo(-1.0*u,13*u);g.lineTo(-.6*u,-6*u);g.lineTo(-.45*u,-76*u);g.lineTo(0,-85.5*u);g.lineTo(.45*u,-76*u);g.lineTo(.6*u,-6*u);g.lineTo(1.0*u,13*u);g.closePath();g.fill();
 g.shadowBlur=0;g.shadowOffsetX=0;g.shadowOffsetY=0;g.fillStyle='rgba(176,255,205,.92)';g.fillRect(-.28*u,-70*u,.56*u,38*u);
 g.strokeStyle='rgba(60,30,10,.7)';g.lineWidth=.18*u;g.beginPath();g.moveTo(0,-6*u);g.lineTo(0,-85*u);g.stroke();
 g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=2*u;g.fillStyle=gr;g.beginPath();g.arc(0,12.5*u,2.1*u,0,TAU);g.fill();g.restore();
 g.save();g.translate(c,c);const hb=g.createRadialGradient(-.8*u,-.8*u,.2*u,0,0,3.8*u);hb.addColorStop(0,'#fff3dc');hb.addColorStop(.6,'#c28a5c');hb.addColorStop(1,'#5e3b21');g.shadowColor='rgba(0,0,0,.7)';g.shadowBlur=2.5*u;g.fillStyle=hb;g.beginPath();g.arc(0,0,3.6*u,0,TAU);g.fill();
 g.shadowBlur=0;const sp=g.createRadialGradient(-.5*u,-.6*u,.1*u,0,0,1.7*u);sp.addColorStop(0,'#8fc2ff');sp.addColorStop(.6,'#1d4fb5');sp.addColorStop(1,'#071c55');g.fillStyle=sp;g.beginPath();g.arc(0,0,1.6*u,0,TAU);g.fill();g.restore()}
function wMarkers(g,lst,sn){const u=W.u,c=W.px/2,now=performance.now(),psi=moonPsi(S.t),P=wMoonPos(sn,psi,lst);

 g.save();g.globalAlpha=alt<-1?.85:1;

/* ===== 7d. WATCH UI: time zone, Moon-cycle controls, frame loop ===== */
const WT={
 en:{today:'Today',date:'Date',close:'Close',tzT:'Time zone',tzA:'Auto (phone)',tz0:'GMT (UTC+0) — Morocco since 20 Sep 2026',tz1:'UTC+1',tzM:'Or type the time your phone shows now:',tzS:'Set',day:'day',hint:'Play, drag the slider, step by day, or pick a date'},
 fr:{today:"Aujourd'hui",date:'Date',close:'Fermer',tzT:'Fuseau horaire',tzA:'Auto (téléphone)',tz0:'GMT (UTC+0) — Maroc depuis le 20 sept. 2026',tz1:'UTC+1',tzM:"Ou saisissez l'heure affichée par votre téléphone :",tzS:'Valider',day:'jour',hint:'Lecture, curseur, pas d’un jour, ou choisir une date'},
 ar:{today:'اليوم',date:'التاريخ',close:'إغلاق',tzT:'المنطقة الزمنية',tzA:'تلقائي (الهاتف)',tz0:'غرينيتش (UTC+0) — المغرب منذ 20 شتنبر 2026',tz1:'UTC+1',tzM:'أو اكتب الوقت الذي يظهر على هاتفك الآن:',tzS:'تأكيد',day:'يوم',hint:'تشغيل، اسحب الشريط، تقدّم يومًا، أو اختر تاريخًا'}};
const wt=k=>(WT[S.lang]||WT.en)[k]||WT.en[k];

/* Morocco returned to GMT permanently on 20 Sep 2026; browsers with older time-zone tables still say UTC+1 */
const TZN=(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||''}catch(e){return''}})();
const MAZ=/^Africa\/(Casablanca|El_Aaiun)$/;
function autoOffset(ms){if(MAZ.test(TZN)&&ms>=Date.UTC(2026,8,20))return 0;return(-new Date(ms).getTimezoneOffset()/60)||0}
function tzSheet(){const f=n=>n===0?'GMT':'UTC'+(n>0?'+':'−')+Math.abs(n),cur=S.tzAuto?'auto':String(S.tz);
 $('help').querySelector('.card').innerHTML=`<h3>${wt('tzT')}</h3><div class="tzopts">
 <button data-v="auto" class="${cur=='auto'?'sel':''}">${wt('tzA')} · ${f(autoOffset(Date.now()))}</button>
 <button data-v="0" class="${cur=='0'?'sel':''}">${wt('tz0')}</button>
 <button data-v="1" class="${cur=='1'?'sel':''}">${wt('tz1')}</button></div>
 <p>${wt('tzM')}</p><div class="mc-row"><input id="tzIn" type="time" style="width:auto"><button id="tzGo">${wt('tzS')}</button></div><p><button id="hx">${wt('close')}</button></p>`;
 $('help').hidden=false;$('hx').onclick=()=>$('help').hidden=true;
 $('help').querySelectorAll('.tzopts button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v=='auto')S.tzAuto=true;else{S.tzAuto=false;S.tz=+v}$('help').hidden=true;draw();toast(f(S.tzAuto?autoOffset(S.t):S.tz))});
 $('tzGo').onclick=()=>{const v=$('tzIn').value;if(!v)return;const[hh,mm]=v.split(':').map(Number),n=new Date(),utc=n.getUTCHours()*60+n.getUTCMinutes();let df=hh*60+mm-utc;df=((df+720)%1440+1440)%1440-720;S.tzAuto=false;S.tz=Math.round(df/30)/2;$('help').hidden=true;draw();toast(f(S.tz))}}

/* Moon cycle: play / pause, day steps, slider and date picker */
const MINV=-30,MAXV=60;
const IC={play:'<svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>',pause:'<svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>',back:'<svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-8 7 8 7z" fill="currentColor"/></svg>',fwd:'<svg viewBox="0 0 24 24" width="20" height="20"><path d="M9 5l8 7-8 7z" fill="currentColor"/></svg>'};
function moonAnim(){if(!S.watch)setWatch(true);if(anim){stopAnim();return}
 S.live=false;anim={d0:Date.now(),v:0,playing:true,last:performance.now(),day:-999};document.body.classList.add('mmode');buildMctl();buildWbtn();wRender()}
function stopAnim(){anim=null;document.body.classList.remove('mmode');const m=$('mctl');m.hidden=true;m.innerHTML='';S.live=true;S.follow=true;S.t=Date.now();draw();buildWbtn()}
function mcSet(v,pause){if(!anim)return;anim.v=Math.max(MINV,Math.min(MAXV,v));if(pause)anim.playing=false;S.t=anim.d0+anim.v*864e5;mcSync(true);wRender()}
function mcSync(force){if(!anim)return;const day=Math.round(anim.v),pl=$('mcPlay');if(pl)pl.innerHTML=anim.playing?IC.pause:IC.play;
 const r=$('mcRange');if(r&&document.activeElement!==r&&(force||day!==anim.day))r.value=day;
 const dt=$('mcDate');if(dt&&document.activeElement!==dt&&(force||day!==anim.day))dt.value=new Date(S.t+S.tz*36e5).toISOString().slice(0,10);
 anim.day=day;updMoonInfo()}
function updMoonInfo(){if(!anim||!S.watch)return;const N=MOONN[S.lang]||MOONN.en,psi=moonPsi(S.t),loc={en:'en-GB',fr:'fr-FR',ar:'ar-u-nu-latn'}[S.lang],d=new Date(S.t+S.tz*36e5);let ds;
 try{ds=d.toLocaleDateString(loc,{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'})}catch(e){ds=d.toISOString().slice(0,10)}
 $('wtime').innerHTML=`<span class="hm">${(moonIllum(S.t)*100).toFixed(0)}%</span>`;
 $('wsub').innerHTML=`<div>${ds}</div><div class="mrow">${moonImg(psi,64)}<div><div class="mn">${N[moonIdx(psi)]}</div><div class="s2"><bdi>${(psi/360*29.530588).toFixed(1)}</bdi> ${wt('day')}</div></div></div>`}
function buildMctl(){const m=$('mctl');if(!anim){m.hidden=true;m.innerHTML='';return}m.hidden=false;
 m.innerHTML=`<div class="mc-row"><button id="mcBack" aria-label="-1 ${wt('day')}">${IC.back}</button><button id="mcPlay" class="big" aria-label="Play / Pause"></button><button id="mcFwd" aria-label="+1 ${wt('day')}">${IC.fwd}</button><button id="mcToday">${wt('today')}</button><button id="mcX" aria-label="${wt('close')}">✕</button></div>
 <input id="mcRange" type="range" min="${MINV}" max="${MAXV}" step="1" value="0" aria-label="${wt('date')}">
 <div class="mc-row"><input id="mcDate" type="date" aria-label="${wt('date')}"></div><div class="note2">${wt('hint')}</div>`;
 $('mcPlay').onclick=()=>{anim.playing=!anim.playing;anim.last=performance.now();mcSync(true)};
 $('mcBack').onclick=()=>mcSet(Math.round(anim.v)-1,true);$('mcFwd').onclick=()=>mcSet(Math.round(anim.v)+1,true);
 $('mcRange').oninput=e=>mcSet(+e.target.value,true);
 $('mcToday').onclick=()=>{anim.d0=Date.now();mcSet(0,true)};$('mcX').onclick=stopAnim;
 $('mcDate').onchange=e=>{const v=e.target.value;if(!v)return;const[y,mo,d]=v.split('-').map(Number),tod=((S.t+S.tz*36e5)%864e5+864e5)%864e5;anim.d0=Date.UTC(y,mo-1,d)+tod-S.tz*36e5;mcSet(0,true)};
 mcSync(true)}

/* frame loop: smooth hand and Sun, Moon-cycle playback */
function wLoop(ts){requestAnimationFrame(wLoop);if(!S.watch||document.hidden)return;const fast=anim&&anim.playing;if(ts-W.last<(fast?15:200))return;const dt=Math.min(100,ts-W.last);W.last=ts;
